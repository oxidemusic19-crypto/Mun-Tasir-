
name: Build PartySync Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=partysync .

      - name: Configure local network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartySync-APK
          path: build/app/outputs/flutter-apk/app-release.apk
