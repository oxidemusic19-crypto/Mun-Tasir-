name: Build PartySync Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name=partysync .

      - name: Set Android compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          found = False
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              updated, count = re.subn(r'(?m)^(\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?)(?:flutter\\.compileSdkVersion|\\d+)', r'\\g<1>36', text)
              if count:
                  path.write_text(updated)
                  found = True
                  print(f'Updated {path}: compileSdk set to 36')
                  print(''.join(line for line in updated.splitlines(True) if 'compileSdk' in line))
          if not found:
              raise SystemExit('ERROR: compileSdk setting not found or not updated')
          PY
      - name: Configure local network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" /><application', 1)
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartySync-APK
          path: build/app/outputs/flutter-apk/app-release.apk
